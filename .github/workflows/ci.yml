name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo run --example walk_away

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82
      - run: cargo test

  wasm-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - run: cargo clippy --target wasm32-unknown-unknown --lib -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Rebuild the module from source, then run the shared vectors against it.
      - run: npm run build && npm test
        working-directory: js
      - run: npm install --no-audit --no-fund && npm test
        working-directory: examples/mcp-server
