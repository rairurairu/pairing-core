[package]
name = "pairing-core"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Price settlement for two-sided marketplaces: inside both people's private limits, revealing neither."
readme = "README.md"
keywords = ["marketplace", "negotiation", "privacy", "agents", "wasm"]
categories = ["algorithms", "wasm", "finance"]
exclude = ["js/node_modules", "js/*.wasm"]

[lib]
crate-type = ["rlib", "cdylib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
